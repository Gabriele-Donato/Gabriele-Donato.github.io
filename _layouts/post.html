<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

  <header class="page-header" style="background-image: url('{{ page.image | relative_url }}');">
    <div class="header-content">
      <div class="site-title">
        <h4>
          <a href="{{ '/' | relative_url }}" style="color:white;text-decoration:none;">
            {{ site.title }}
          </a>
        </h4>
      </div>
      <nav>
        <ul>
          <li><a href="{{ '/about/' | relative_url }}" style="text-decoration:none">ABOUT</a></li>
          <li><a href="{{ '/resources/' | relative_url }}" style="text-decoration:none">RESOURCES</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="post-with-toc">
    
    {% include post-toc.html %}
    
    <main class="main-content">
      <article class="post">
        <header class="post-header">
          <h1 class="post-title">{{ page.title }}</h1>
          <p class="post-date" style="text-align:center;">
            {{ page.date | date: "%B %d, %Y" }}
          </p>
        </header>

        <div class="post-content" id="post-content">
          {{ content }}
        </div>
      </article>
    </main>

  </div>

  <footer class="site-footer">
    <p>Contact me at: <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </footer>

  <script src="{{ '/assets/js/post-toc.js' | relative_url }}"></script>
</body>
</html>
