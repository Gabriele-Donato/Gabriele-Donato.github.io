<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Transparent floating hamburger menu button -->
  <button id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Menu">
    <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
  </button>

  <div class="nav-overlay" id="nav-overlay"></div>
  <div class="mobile-nav-drawer" id="mobile-nav-drawer">
    <div class="drawer-title">MENU</div>
    <ul>
      <li><a href="{{ '/' | relative_url }}">HOME</a></li>
      <li><a href="{{ '/about/' | relative_url }}">ABOUT</a></li>
      <li><a href="{{ '/resources/' | relative_url }}">RESOURCES</a></li>
    </ul>
  </div>

  <header class="page-header" style="background-image: url('{{ page.image | relative_url }}');">
    <div class="header-content">
      <div class="site-title">
        <h4>
          <a href="{{ '/' | relative_url }}" style="color:white;text-decoration:none;">
            {{ site.title }}
          </a>
        </h4>
      </div>
      <nav>
        <ul>
          <li><a href="{{ '/about/' | relative_url }}" style="text-decoration:none">ABOUT</a></li>
          <li><a href="{{ '/resources/' | relative_url }}" style="text-decoration:none">RESOURCES</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Contact me at: <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toggleBtn = document.getElementById("mobile-nav-toggle");
      const drawer = document.getElementById("mobile-nav-drawer");
      const overlay = document.getElementById("nav-overlay");

      if (toggleBtn && drawer && overlay) {
        function closeDrawer() {
          drawer.classList.remove("open");
          overlay.classList.remove("open");
          document.body.style.overflow = "";
        }

        toggleBtn.addEventListener("click", function() {
          drawer.classList.toggle("open");
          overlay.classList.toggle("open");
          document.body.style.overflow = drawer.classList.contains("open") ? "hidden" : "";
        });

        overlay.addEventListener("click", closeDrawer);
      }
    });
  </script>
</body>
</html>
