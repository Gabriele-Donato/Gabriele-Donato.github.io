---
layout: default
---
<div class="post-wrap">

  <aside class="toc-rail" aria-label="Table of contents">
    <div class="toc-rail__sticky">
      <p class="toc-rail__label">CONTENTS</p>
      <nav id="toc-desktop"></nav>
    </div>
  </aside>

  <article class="post">
    <header class="post__header">
      <h1 class="post__title">{{ page.title }}</h1>
      <p class="post__date">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      </p>
    </header>

    <div class="post__content" id="post-content">
      {{ content }}
    </div>

    <nav class="post__nav" aria-label="Post navigation">
      {%- if page.previous.url %}
      <a class="post__nav-prev" href="{{ page.previous.url | relative_url }}">
        <span>Previous</span>{{ page.previous.title }}
      </a>
      {%- endif %}
      {%- if page.next.url %}
      <a class="post__nav-next" href="{{ page.next.url | relative_url }}">
        <span>Next</span>{{ page.next.title }}
      </a>
      {%- endif %}
    </nav>
  </article>

</div>
